<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Shared photo map review · Puddl</title><link rel="stylesheet" href="/lens/lens.css"><style>main{max-width:1500px}.review-grid{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(320px,.75fr);gap:24px;align-items:start}.picture{position:relative}.picture img{display:block;width:100%;height:auto}.overlay{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}.side{min-width:0}.expired{border-left:4px solid #e05252}.list{max-height:420px;overflow:auto}@media(max-width:850px){.review-grid{grid-template-columns:1fr}}</style></head>
<body><main><a href="/lens/">← Puddle Lens</a><h1 id="title">Shared map review</h1><p id="summary" class="note">Opening the review…</p><div id="error" class="error hidden"></div><section id="review" class="review-grid hidden"><div class="picture"><img id="photo" alt="Hand-drawn network map"><svg id="overlay" class="overlay" viewBox="0 0 1000 1000" preserveAspectRatio="none"></svg></div><div class="side"><div id="warnings" class="warning hidden"></div><h2>Nodes</h2><div class="list"><table><thead><tr><th>#</th><th>Name</th><th>Shape</th><th>Reading</th></tr></thead><tbody id="nodes"></tbody></table></div><h2>Connections</h2><div class="list"><table><thead><tr><th>#</th><th>Connection</th><th>Reading</th></tr></thead><tbody id="edges"></tbody></table></div></div></section></main><script src="/lens/shared-review.js"></script></body></html>
