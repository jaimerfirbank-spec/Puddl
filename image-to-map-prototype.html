<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Puddl AI Image-to-Map Test</title><!-- preview redeploy 2 -->
  <style>
    :root{font-family:Inter,ui-sans-serif,system-ui,-apple-system,sans-serif;color:#17233a;background:#eef3f8}
    *{box-sizing:border-box}body{margin:0}.page{max-width:1500px;margin:auto;padding:28px}.top{display:flex;justify-content:space-between;align-items:center;gap:20px;margin-bottom:20px}.top h1{margin:0;font-size:clamp(26px,4vw,42px)}.top p{margin:6px 0 0;color:#5b6980}.badge{background:#dff4ea;color:#17714c;padding:9px 13px;border-radius:999px;font-weight:800;white-space:nowrap}
    .card{background:white;border:1px solid #d7dfeb;border-radius:20px;padding:24px;box-shadow:0 10px 30px #26365012}.upload{border:3px dashed #2f75e8;border-radius:16px;padding:30px;text-align:center;background:#f7faff;cursor:pointer}.upload strong{display:block;font-size:23px}.upload span{color:#5b6980}.controls{display:flex;gap:12px;align-items:center;margin-top:16px;flex-wrap:wrap}button{border:0;border-radius:12px;padding:14px 22px;font:inherit;font-weight:800;cursor:pointer;background:#286de0;color:white}button:disabled{opacity:.45;cursor:not-allowed}.clear{background:#e8eef7;color:#263650}.status{font-weight:700;color:#516078}.error{color:#b42318;background:#fff0ee;border:1px solid #ffc9c2;padding:12px 15px;border-radius:10px;margin-top:14px}.hidden{display:none}
    .result{margin-top:22px}.grid{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(360px,.7fr);gap:22px}.picture{position:relative;background:#f2f5f8;border-radius:15px;overflow:hidden;align-self:start}.picture img{display:block;width:100%;height:auto}.overlay{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}.side{min-width:0}.pills{display:flex;gap:8px;flex-wrap:wrap}.pill{background:#edf2f8;border-radius:999px;padding:7px 11px;font-weight:800}.warning{margin-top:12px;color:#9b5c00;background:#fff5dc;padding:11px 13px;border-radius:10px}h2{margin:3px 0 15px}h3{margin:25px 0 8px}table{width:100%;border-collapse:collapse;font-size:15px}th,td{text-align:left;padding:11px 8px;border-bottom:1px solid #dce3ec;vertical-align:top}th{color:#637089}.low{color:#ad5f00;font-weight:800}.good{color:#168353;font-weight:800}.note{font-size:13px;color:#68758a;margin-top:14px}
    @media(max-width:900px){.page{padding:16px}.grid{grid-template-columns:1fr}.top{align-items:flex-start}.card{padding:16px}}
  </style>
</head>
<body>
  <main class="page">
    <div class="top"><div><h1>Puddl AI Image-to-Map test</h1><p>The photo is read securely. Nothing is added to your real map.</p></div><span class="badge">AI test</span></div>
    <section class="card">
      <label class="upload" for="file"><strong>Choose one hand-drawn map photo</strong><span>JPG, PNG or WebP — black marker on white paper works best</span></label>
      <input id="file" type="file" accept="image/jpeg,image/png,image/webp" hidden>
      <div class="controls"><button id="read" disabled>Read map with AI</button><button id="clear" class="clear" type="button">Clear</button><span id="status" class="status">Choose a photo.</span></div>
      <div id="error" class="error hidden"></div>
    </section>
    <section id="result" class="card result hidden"></section>
  </main>
<script>
const $=id=>document.getElementById(id);let chosen=null,previewUrl='',currentData=null;
function setStatus(text){$('status').textContent=text}
function showError(text){$('error').textContent=text;$('error').classList.remove('hidden')}
function clearError(){$('error').classList.add('hidden');$('error').textContent=''}
$('file').addEventListener('change',()=>{chosen=$('file').files&&$('file').files[0]||null;$('read').disabled=!chosen;clearError();$('result').classList.add('hidden');setStatus(chosen?chosen.name:'Choose a photo.')});
$('clear').addEventListener('click',()=>{chosen=null;$('file').value='';$('read').disabled=true;$('result').classList.add('hidden');clearError();setStatus('Choose a photo.')});
function loadImage(file){return new Promise((resolve,reject)=>{const url=URL.createObjectURL(file),image=new Image();image.onload=()=>{URL.revokeObjectURL(url);resolve(image)};image.onerror=reject;image.src=url})}
async function prepareImage(file){const image=await loadImage(file),maxSide=2000,scale=Math.min(1,maxSide/Math.max(image.naturalWidth,image.naturalHeight));const canvas=document.createElement('canvas');canvas.width=Math.round(image.naturalWidth*scale);canvas.height=Math.round(image.naturalHeight*scale);const context=canvas.getContext('2d');context.fillStyle='white';context.fillRect(0,0,canvas.width,canvas.height);context.drawImage(image,0,0,canvas.width,canvas.height);return canvas.toDataURL('image/jpeg',.86)}
function confidenceClass(value){return value>=70?'good':'low'}
function addCell(row,text,className){const cell=document.createElement('td');cell.textContent=String(text);if(className)cell.className=className;row.appendChild(cell)}
function addInputCell(row,value,onchange,options){const cell=document.createElement('td');let input;if(options){input=document.createElement('select');options.forEach(option=>{const item=document.createElement('option'),optionValue=typeof option==='object'?option.value:option,optionLabel=typeof option==='object'?option.label:option;item.value=optionValue;item.textContent=optionLabel;item.selected=optionValue===value;input.appendChild(item)})}else{input=document.createElement('input');input.type='text';input.value=value}input.style.cssText='width:100%;min-width:90px;padding:7px;border:1px solid #cbd5e1;border-radius:7px;font:inherit';input.addEventListener('change',()=>onchange(input.value));cell.appendChild(input);row.appendChild(cell)}
function addDeleteCell(row,onclick){const cell=document.createElement('td'),button=document.createElement('button');button.type='button';button.textContent='Remove';button.className='clear';button.style.cssText='padding:7px 10px;font-size:12px';button.addEventListener('click',onclick);cell.appendChild(button);row.appendChild(cell)}
function nodeName(nodes,id){const node=nodes.find(n=>n.id===id);return node?node.label:id}
function connectionText(edge,nodes){const a=nodeName(nodes,edge.source),b=nodeName(nodes,edge.target);if(edge.direction==='both')return a+' ↔ '+b;if(edge.direction==='target_to_source')return b+' → '+a;if(edge.direction==='unclear')return a+' — '+b;return a+' → '+b}
function drawOverlay(svg,nodes,edges){const ns='http://www.w3.org/2000/svg';edges.forEach(edge=>{const a=nodes.find(n=>n.id===edge.source),b=nodes.find(n=>n.id===edge.target);if(!a||!b)return;const line=document.createElementNS(ns,'line');line.setAttribute('x1',a.x+a.width/2);line.setAttribute('y1',a.y+a.height/2);line.setAttribute('x2',b.x+b.width/2);line.setAttribute('y2',b.y+b.height/2);line.setAttribute('stroke','#e39a15');line.setAttribute('stroke-width','4');line.setAttribute('opacity','.8');svg.appendChild(line)});nodes.forEach((node,index)=>{const rect=document.createElementNS(ns,'rect');rect.setAttribute('x',node.x);rect.setAttribute('y',node.y);rect.setAttribute('width',node.width);rect.setAttribute('height',node.height);rect.setAttribute('fill','none');rect.setAttribute('stroke',node.confidence>=70?'#14a36f':'#e05252');rect.setAttribute('stroke-width','4');svg.appendChild(rect);const text=document.createElementNS(ns,'text');text.setAttribute('x',node.x);text.setAttribute('y',Math.max(22,node.y-7));text.setAttribute('fill',node.confidence>=70?'#087a50':'#c23d3d');text.setAttribute('font-size','22');text.setAttribute('font-weight','800');text.textContent=(index+1)+' '+node.label;svg.appendChild(text)})}
function heading(text,level=3){const h=document.createElement('h'+level);h.textContent=text;return h}
function render(imageUrl,data){
  currentData=data;const result=$('result');result.replaceChildren();const grid=document.createElement('div');grid.className='grid';
  const picture=document.createElement('div');picture.className='picture';const img=document.createElement('img');img.src=imageUrl;img.alt='Uploaded hand-drawn map';picture.appendChild(img);const svg=document.createElementNS('http://www.w3.org/2000/svg','svg');svg.classList.add('overlay');svg.setAttribute('viewBox','0 0 1000 1000');svg.setAttribute('preserveAspectRatio','none');picture.appendChild(svg);drawOverlay(svg,data.nodes,data.edges);
  const side=document.createElement('div');side.className='side';side.appendChild(heading('AI reading',2));const pills=document.createElement('div');pills.className='pills';for(const text of [data.nodes.length+' nodes',data.edges.length+' connections']){const p=document.createElement('span');p.className='pill';p.textContent=text;pills.appendChild(p)}side.appendChild(pills);
  if(data.warnings.length){const warning=document.createElement('div');warning.className='warning';warning.textContent=data.warnings.join(' • ');side.appendChild(warning)}
  side.appendChild(heading('Check and correct nodes'));const nt=document.createElement('table');const nh=document.createElement('tr');for(const t of ['#','Name','Shape','Reading','']){const th=document.createElement('th');th.textContent=t;nh.appendChild(th)}nt.appendChild(nh);data.nodes.forEach((node,index)=>{const row=document.createElement('tr');addCell(row,index+1);addInputCell(row,node.label,value=>{node.label=value;render(imageUrl,data)});addInputCell(row,node.shape,value=>{node.shape=value;render(imageUrl,data)},['circle','oval','rectangle','unknown']);addCell(row,node.confidence+'%',confidenceClass(node.confidence));addDeleteCell(row,()=>{data.nodes.splice(index,1);data.edges=data.edges.filter(edge=>edge.source!==node.id&&edge.target!==node.id);render(imageUrl,data)});nt.appendChild(row)});side.appendChild(nt);
  const addNode=document.createElement('button');addNode.type='button';addNode.className='clear';addNode.style.marginTop='10px';addNode.textContent='+ Add missing node';addNode.addEventListener('click',()=>{const id='n'+Date.now();data.nodes.push({id,label:'NEW NODE',shape:'circle',x:450,y:450,width:100,height:100,confidence:100,notes:'Added by user'});render(imageUrl,data)});side.appendChild(addNode);
  side.appendChild(heading('Check and correct connections'));const et=document.createElement('table');const eh=document.createElement('tr');for(const t of ['From','Direction','To','Reading','']){const th=document.createElement('th');th.textContent=t;eh.appendChild(th)}et.appendChild(eh);data.edges.forEach((edge,index)=>{const row=document.createElement('tr'),ids=data.nodes.map(node=>({value:node.id,label:node.label}));addInputCell(row,edge.source,value=>{edge.source=value;render(imageUrl,data)},ids);addInputCell(row,edge.direction,value=>{edge.direction=value;render(imageUrl,data)},['source_to_target','both','target_to_source','unclear']);addInputCell(row,edge.target,value=>{edge.target=value;render(imageUrl,data)},ids);addCell(row,edge.confidence+'%',confidenceClass(edge.confidence));addDeleteCell(row,()=>{data.edges.splice(index,1);render(imageUrl,data)});et.appendChild(row)});side.appendChild(et);
  const addEdge=document.createElement('button');addEdge.type='button';addEdge.className='clear';addEdge.style.marginTop='10px';addEdge.textContent='+ Add missing connection';addEdge.disabled=data.nodes.length<2;addEdge.addEventListener('click',()=>{data.edges.push({source:data.nodes[0].id,target:data.nodes[1].id,direction:'source_to_target',confidence:100,notes:'Added by user'});render(imageUrl,data)});side.appendChild(addEdge);
  const actions=document.createElement('div');actions.className='controls';actions.style.cssText='margin-top:24px;padding-top:18px;border-top:1px solid #dce3ec';const create=document.createElement('button');create.type='button';create.textContent='Create Puddle map';create.addEventListener('click',()=>{sessionStorage.setItem('puddl_image_import',JSON.stringify({version:1,title:(chosen&&chosen.name?chosen.name.replace(/\.[^.]+$/,''):'Photo map'),nodes:data.nodes,edges:data.edges}));window.location.href='/?imageImport=1'});actions.appendChild(create);side.appendChild(actions);
  const note=document.createElement('p');note.className='note';note.textContent='Correct anything that is wrong, then create the editable Puddle map.';side.appendChild(note);grid.append(picture,side);result.appendChild(grid);result.classList.remove('hidden');
}
$('read').addEventListener('click',async()=>{if(!chosen)return;$('read').disabled=true;clearError();$('result').classList.add('hidden');try{setStatus('Preparing photo…');const image=await prepareImage(chosen);previewUrl=image;setStatus('AI is reading the map… This may take a minute.');const response=await fetch('/api/image-to-map',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({image,filename:chosen.name})});const body=await response.json();if(!response.ok)throw new Error(body.error||'The photo reader failed.');render(previewUrl,body.result);setStatus('Finished. Check the reading.')}catch(error){showError(error.message||'The photo reader failed.');setStatus('Could not finish.')}finally{$('read').disabled=!chosen}});
</script>
</body>
</html>
